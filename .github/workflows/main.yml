name: Sincronizar Pizarra SIGA

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: siga-sync-job
  cancel-in-progress: false

jobs:
  sync-siga:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install chromium
      - name: Bucle 24/7 cada 4 minutos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          for i in $(seq 1 38); do
            echo "=== Ciclo $i de 38 ==="
            npm run sync || echo "Error temporal en ciclo $i, reintentando en 4 min..."
            if [ "$i" -lt 38 ]; then sleep 240; fi
          done
